[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiledokan-scraper"
version = "1.0.0"
description = "A respectful Python scraper for MobileDokan smartphone listings and specifications."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "MobileDokan Scraper contributors" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
mobiledokan-scraper = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["mobiledokan_scraper*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
markers = [
    "live: tests that make real requests to MobileDokan and are opt-in",
]
pythonpath = ["."]
testpaths = ["tests", "test_price_integration.py"]

[tool.coverage.run]
branch = true
source = ["mobiledokan_scraper"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

